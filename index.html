<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio-Schneider · ms-genau | KodiniTools</title>
    <meta name="description" content="Audiodateien millisekundengenau schneiden – lokal im Browser oder serverseitig." />

    <!-- Theme fruehestmoeglich setzen (kein Flash). Gleiche Logik wie die
         globale Nav: gespeicherte Wahl -> sonst System-Praeferenz. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Google Consent Mode v2 - DSGVO/GDPR Compliant -->
    <!-- Muss VOR allem anderen laufen (setzt Default = denied). -->
    <script>
      // Initialize dataLayer and set default consent to denied
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Set default consent state - all denied until user accepts
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });

      // Load saved consent from localStorage
      (function() {
        try {
          var savedConsent = localStorage.getItem('cookieConsent');
          if (savedConsent) {
            var consent = JSON.parse(savedConsent);
            if (consent.analytics) {
              gtag('consent', 'update', {
                'analytics_storage': 'granted',
                'functionality_storage': 'granted',
                'personalization_storage': 'granted'
              });
            }
            if (consent.marketing) {
              gtag('consent', 'update', {
                'ad_storage': 'granted',
                'ad_user_data': 'granted',
                'ad_personalization': 'granted'
              });
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
