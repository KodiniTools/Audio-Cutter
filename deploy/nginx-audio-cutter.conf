# In den bestehenden server{}-Block von kodinitools.com einfügen.
# Wichtig: Diese location-Bloecke NICHT in ein separates try_files-Snippet
# packen, das mit dem globalen "location /" kollidiert (bekanntes Problem).

# 1) Statische SPA im Unterverzeichnis mit eigenem Fallback.
location /audio-cutter/ {
    alias /var/www/kodinitools.com/audio-cutter/;
    try_files $uri $uri/ /audio-cutter/index.html;
}

# 2) API zum Node-Backend (PM2, Port 9017).
#    Trailing-Slash bei proxy_pass strippt das Praefix:
#    /audio-cutter/api/cut  ->  http://127.0.0.1:9017/cut
location /audio-cutter/api/ {
    proxy_pass http://127.0.0.1:9017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Grosse Uploads + lange FFmpeg-Laeufe zulassen.
    client_max_body_size 320m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
}
